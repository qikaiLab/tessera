name: 缺陷报告
description: 报告可复现的异常或数据问题
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: severity
    attributes:
      label: 影响程度
      options:
        - 数据丢失或安全风险
        - 核心功能不可用
        - 一般功能异常
        - 视觉或体验问题
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MotoTrace 版本
      placeholder: v0.4.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用脱敏数据给出最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附截图或脱敏日志，不要上传真实记录、数据库或密钥。
