name: 缺陷报告
description: 报告可复现的异常或数据问题
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: severity
    attributes:
      label: 影响程度
      options:
        - 数据丢失或损坏
        - 核心功能不可用
        - 一般功能异常
        - 视觉或体验问题
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tessera 版本
      placeholder: v0.5.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows 版本与屏幕
      description: 例如“Windows 11 23H2，1920×1080，缩放 150%”。界面问题请务必填写。
      placeholder: Windows 11，1920×1080，缩放 125%
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用脱敏数据给出最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附截图（先遮住个人内容）。软件本身不写日志文件，不用找日志。不要上传真实记录、数据库或密钥。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复。
          required: true
        - label: 这个问题不涉及安全漏洞（涉及的话请按 SECURITY.md 用邮件联系），且我没有上传真实的个人记录、数据库或密钥。
          required: true
