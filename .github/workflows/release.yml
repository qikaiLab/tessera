name: Release Windows App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # The whole history: the next step asks whether the tagged commit is on main.
          fetch-depth: 0

      - name: Check that the tag is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main. Merge first, then tag main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Gate
        run: npm run check

      - name: Run Electron smoke tests
        run: npx playwright test

      - name: Build Application
        run: npm run dist -- --publish never

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          # The files that are about to be published, not the build output the suite above used.
          $env:MOTOTRACE_E2E_EXECUTABLE = (Resolve-Path 'release/win-unpacked/MotoTrace.exe').Path
          npx playwright test tests/e2e/smoke.spec.mjs

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath release -File |
            Where-Object {
              $_.Name -ne 'builder-debug.yml' -and
              $_.Extension -in '.exe', '.zip', '.blockmap', '.yml'
            } |
            Sort-Object Name
          $lines = $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
        
      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
