name: CI

# Each branch push runs the gate once. `main` is not run again after a fast-forward merge (the same
# commit has just been through it); before a release tag, run it there by hand:
#   gh workflow run ci.yml --ref main
# The dependency audit is not part of this gate; see audit.yml.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    # A pull request from a fork would run its own code on the runner; those are not accepted
    # (see close-external-pull-requests.yml), and pushes to this repository are covered above.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check

      - name: Run Electron smoke tests
        run: npx playwright test
